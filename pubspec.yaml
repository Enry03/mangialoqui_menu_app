name: mangialoqui_menu
description: App per la gestione del menu del ristorante.
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8
  lucide_flutter: ^1.25.0
  flutter_material_design_icons: ^3.1.0+7447
  supabase_flutter: ^2.5.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.2
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^4.0.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icon/app_icon.png"
